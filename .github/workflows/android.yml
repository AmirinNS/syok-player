name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-unit-test:
    name: Build, Lint and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate Gradle Wrapper
        # gradle/actions/wrapper-validation@v6.4.1
        uses: gradle/actions/wrapper-validation@7296c772c13d12d9871528814b51fb2143c138ef

      - name: Set up JDK 17
        # actions/setup-java@v6.2.0
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        # gradle/actions/setup-gradle@v6.4.1
        uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef

      - name: Run Lint
        run: ./gradlew :app:lintDebug

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug

  instrumentation-test:
    name: Connected Android Tests (Emulator)
    runs-on: ubuntu-latest
    needs: build-and-unit-test

    steps:
      - name: Checkout Repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        # actions/setup-java@v6.2.0
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        # gradle/actions/setup-gradle@v6.4.1
        uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Connected Tests on Android 34
        # reactivecircus/android-emulator-runner@v2.38.0
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_3a
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
